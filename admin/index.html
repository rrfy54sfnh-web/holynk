<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Holynk — Administration</title><style>
:root{--orange:#d84316;--ink:#151515;--cream:#faf7f5;--line:#eee9e6}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f1ef;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:490px;margin:auto;min-height:100dvh;background:#fff;padding-bottom:94px;box-shadow:0 0 40px #0000000b}.top{padding:24px 22px 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--orange)}.muted{color:#89817d;font-size:13px}.section{padding:10px 22px}.headline{font-size:29px;line-height:1.17;margin:14px 0 22px;letter-spacing:-1px}.headline em{font-style:normal;color:var(--orange)}.search{display:flex;gap:8px}.field{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;width:100%;outline:none;min-width:0}.btn{border:0;border-radius:12px;background:var(--orange);color:#fff;padding:14px 17px;font-weight:700}.btn.black{background:#111}.btn.light{background:#f9eeea;color:var(--orange)}.btn.outline{background:white;border:1px solid #ded6d2;color:#222}.btn:disabled{opacity:.5}.wide{width:100%}.heading{font-weight:800;font-size:18px;margin:17px 0}.smallcap{font-size:11px;letter-spacing:1.3px;color:#aaa;text-transform:uppercase;margin:24px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.property{height:240px;border-radius:17px;overflow:hidden;position:relative;background:#ddd;color:#fff}.property img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 27%,#000c)}.property .info{position:absolute;bottom:12px;left:12px;right:12px}.property h3{font-size:15px;margin:0 0 4px}.property p{font-size:11px;margin:4px 0}.price{display:inline-block;border:1px solid #ffffffb5;border-radius:20px;padding:6px 8px;font-size:11px;margin:6px 0}.heart{position:absolute;right:8px;top:9px;border:0;background:#ffffffdb;border-radius:50%;width:34px;height:34px;font-size:19px;color:#222}.pill{position:absolute;top:12px;left:10px;background:#111;border-radius:20px;padding:6px 12px;font-size:11px}.view{border:1px solid #fff;background:#111;color:#fff;border-radius:20px;padding:6px 14px;font-size:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:490px;width:100%;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:12px 6px max(13px,env(safe-area-inset-bottom));z-index:10;box-shadow:0 -5px 22px #00000009}.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#222;min-width:65px}.nav button i{font-style:normal;font-size:23px}.nav button.active{color:var(--orange)}.panel{border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;background:#fff}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.chip{display:inline-block;padding:8px 13px;border:1px solid #eee;border-radius:20px;background:#fff;margin:3px;font-size:12px}.chip.selected{background:#fff0ea;border-color:var(--orange);color:var(--orange)}.heroimg{width:100%;height:245px;object-fit:cover;border-radius:17px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:8px}.thumbs img{height:60px;width:75px;object-fit:cover;border-radius:9px;cursor:pointer}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #f0ebe8;border-radius:11px;padding:12px 6px;text-align:center;font-size:11px}.metric strong{display:block;font-size:16px;color:var(--orange)}.row{display:flex;gap:10px;align-items:center}.avatar{border-radius:50%;background:#f9e8e3;color:var(--orange);width:45px;height:45px;display:grid;place-items:center;font-weight:800;flex-shrink:0}.score{background:linear-gradient(120deg,#171515,#d84316);color:#fff;border-radius:19px;padding:23px;display:flex;justify-content:space-between;align-items:center}.ring{width:116px;height:116px;border:10px solid #ffb67d;border-radius:50%;display:grid;place-content:center;text-align:center;font-size:40px;font-weight:900}.ring small{font-size:12px}.bar{height:7px;border-radius:8px;background:#eee;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--orange)}.chatbubble{padding:12px;border-radius:13px;max-width:83%;margin:8px 0;background:#f6f2f0;font-size:14px}.chatbubble.mine{background:#fbe6df;margin-left:auto}.step{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;background:#e5e5e5;margin:4px;font-size:12px}.step.on{background:var(--orange);color:white}.notice{background:#fff4ee;border-radius:12px;padding:12px;font-size:12px;color:#995030;margin:10px 0}.tab{border:0;background:#f6f1ee;padding:11px;border-radius:12px;flex:1}.tab.active{background:var(--orange);color:white}.hidden{display:none}.empty{text-align:center;padding:55px 20px;color:#999}.back{border:0;background:none;font-size:20px}.detail-label{font-size:13px;font-weight:700;margin:13px 0 7px}textarea{resize:vertical}img{display:block}

/* Onboarding fidèle aux choix visuels : blanc, noir, orange brûlé */
.welcome-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:28px 24px 125px;text-align:center}.welcome-main{margin:auto 0}.brand-house{font-size:77px;font-weight:900;line-height:.75;color:#111}.welcome-brand{font-size:59px;font-weight:900;letter-spacing:-3px;color:#050505}.welcome-brand span{color:var(--orange)}.welcome-main p{font-size:19px;line-height:1.45;color:#777;margin-top:25px}.welcome-cta{position:absolute;bottom:80px;left:7%;width:86%;height:59px;font-size:17px}.access-screen{min-height:100dvh;position:relative;overflow:hidden;background:white}.access-photo{height:54dvh;background:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200') center/cover}.access-sheet{background:#fff;position:relative;margin-top:-55px;border-radius:50% 50% 0 0 / 55px 55px 0 0;min-height:51dvh;padding:65px 30px 45px;text-align:center}.access-sheet p{color:#777;font-size:17px;line-height:1.4;margin:22px 0 40px}.access-sheet .btn{margin-bottom:12px;height:56px}.app:has(.welcome-screen),.app:has(.access-screen){padding-bottom:0}.app:has(.welcome-screen) .nav,.app:has(.access-screen) .nav{display:none}

.wa-btn{background:#168b52;color:#fff;border:0;border-radius:12px;padding:14px 17px;font-weight:750}.wa-btn.wide{width:100%}.muted-note{font-size:12px;color:#8c817b;line-height:1.5}.manage-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.manage-row button{font-size:12px;padding:9px 12px}.status-label{font-size:11px;background:#fff1e8;color:#b64b22;padding:5px 9px;border-radius:30px}.property.unavailable{opacity:.62}.property.unavailable .pill{background:#773f35}
</style></head><body><div id="app" class="app"></div><script>
const photos=['https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800','https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800','https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800','https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=800','https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=800','https://images.unsplash.com/photo-1600573472591-ee6b68d14c68?w=800'];
const initial=[];
const WHATSAPP='221771301739';
function whatsappLink(p,visit){const label=visit?'demander une visite pour':'obtenir des informations sur';const msg=`Bonjour, je vous contacte depuis Holynk pour ${label} : ${p.title}, ${p.location}, ${money(p.price)}${p.listingType==='À vendre'?'':' / mois'}. Est-ce toujours disponible ?`;return 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg)}
function contactWhatsapp(id,visit=false){const p=state.properties.find(x=>x.id===id);if(!p)return;window.open(whatsappLink(p,visit),'_blank','noopener,noreferrer')}
const state={page:'brokerGate',mode:'client',properties:initial,favs:[],search:'',filter:false,type:'Tout',max:'',minScore:'',selected:null,photo:0,thread:0,messages:{},visit:{},draft:{type:'À louer',amenities:[]},step:1,scoreTab:'Score',rating:'Tous',showIntro:false,editingId:null};const money=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');function go(p){if(['welcome','access','home','detail','visit','favs','chats','conversation'].includes(p))p='dashboard';if(['dashboard','myproperties','add','requests','profile','settings'].includes(p)&&!brokerUnlocked){openBrokerGate();return}if(!['welcome','access'].includes(state.page))persist();state.page=p;render();window.scrollTo(0,0)}function property(){return state.properties.find(p=>p.id===state.selected)}function header(title,back='home'){return `<header class="top"><button class="back" onclick="go('${back}')">←</button><strong>${title}</strong><span style="width:30px"></span></header>`}function logo(){return `<div class="logo">⌂Ho<span>Lynk</span></div>`}function nav(){const tabs=[['dashboard','▦','Tableau'],['myproperties','⌂','Mes biens'],['add','+','Publier'],['profile','♟','Profil']];return `<nav class="nav">${tabs.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" onclick="${p==='add'?'newListing()':`go('${p}')`}"><i>${i}</i>${t}</button>`).join('')}</nav>`}
function cards(arr){return arr.length?`<div class="cards">${arr.map(p=>`<div class="property ${p.available===false?'unavailable':''}"><img src="${esc(p.img)}" alt="Logement" loading="lazy"><div class="shade"></div><span class="pill">${p.available===false?'Indisponible':esc(p.listingType||'À louer')}</span><button class="heart" onclick="fav(${p.id})">${state.favs.includes(p.id)?'♥':'♡'}</button><div class="info"><h3>${esc(p.title)}</h3><p>⌖ ${esc(p.location)}</p><span class="price">${money(p.price)}${p.listingType==='À vendre'?'':' / mois'}</span><div class="flex"><small>Holynk</small><button class="view" onclick="openProperty(${p.id})">Voir</button></div></div></div>`).join('')}</div>`:'<div class="empty">Aucun logement trouvé. Modifie tes filtres.</div>'}function fav(id){state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();render()}function openProperty(id){state.selected=id;state.photo=0;go('detail')}function home(){let arr=state.properties.filter(p=>p.available!==false&&(p.title+' '+p.location).toLowerCase().includes(state.search.toLowerCase())&&(state.type==='Tout'||p.type===state.type)&&(!state.max||p.price<=+state.max)&&(!state.minScore||p.score>=+state.minScore));return `<div class="top">${logo()}<span style="width:30px"></span></div><div class="section"><div class="headline">Cherchez,<br><b>Trouvez, <em>Emménagez.</em></b></div><div class="search"><input class="field" placeholder="Rechercher un quartier, une ville" value="${esc(state.search)}" oninput="state.search=this.value;updateCards()"><button class="btn black" onclick="state.filter=!state.filter;render()">☷</button></div>${state.filter?`<div class="panel"><div class="detail-label">Type de logement</div>${['Tout','Studio','Chambre','Appartement','Villa','Maison'].map(t=>`<button class="chip ${state.type===t?'selected':''}" onclick="state.type='${t}';render()">${t}</button>`).join('')}<div class="detail-label">Budget maximal (FCFA)</div><input class="field" type="number" placeholder="Ex. 200000" value="${state.max}" oninput="state.max=this.value"><div class="detail-label">Score courtier minimum</div><input class="field" type="number" min="0" max="100" placeholder="Ex. 85" value="${state.minScore}" oninput="state.minScore=this.value"><button class="btn wide" style="margin-top:12px" onclick="state.filter=false;render()">Appliquer les filtres</button></div>`:''}<div class="smallcap">Des biens pouvant vous intéresser</div><div id="results">${cards(arr)}</div></div>`}function updateCards(){let arr=state.properties.filter(p=>p.available!==false&&(p.title+' '+p.location).toLowerCase().includes(state.search.toLowerCase())&&(state.type==='Tout'||p.type===state.type)&&(!state.max||p.price<=+state.max)&&(!state.minScore||p.score>=+state.minScore));document.getElementById('results').innerHTML=cards(arr)}function detail(){let p=property();if(!p)return `${header('Bien introuvable')}<div class="section empty">Cette annonce n’est plus disponible.</div>`;let pic=[p.img,...photos.filter(x=>x!==p.img)];return `${header('Détails du bien')}<div class="section"><img class="heroimg" src="${pic[state.photo%pic.length]}"><div class="thumbs">${pic.slice(0,5).map((x,i)=>`<img src="${x}" onclick="state.photo=${i};render()">`).join('')}</div><div class="flex"><h2>${esc(p.title)}</h2><button class="btn light" onclick="fav(${p.id})">${state.favs.includes(p.id)?'♥':'♡'}</button></div><p class="muted">⌖ ${esc(p.location)} · Contact Holynk</p><div class="grid3"><div class="metric">🛏️<strong>${p.rooms}</strong>Chambre(s)</div><div class="metric">▤<strong>${p.area} m²</strong>Surface</div><div class="metric">⌂<strong>${esc(p.type)}</strong>Type</div></div><h3 class="heading">Description</h3><p>${esc(p.description||'Découvrez ce logement situé à '+p.location+'. Contactez le courtier pour confirmer les caractéristiques, la disponibilité et les conditions de location.')}</p><h3 class="heading">Commodités</h3>${p.amenities.map(x=>`<span class="chip">✓ ${esc(x)}</span>`).join('')}<h3 class="heading">Informations financières</h3><div class="panel"><div class="flex"><span>Loyer mensuel</span><b>${money(p.price)}</b></div><hr style="border:0;border-top:1px solid #eee"><div class="flex"><span>Caution indicative</span><b>${money(p.deposit)}</b></div><hr style="border:0;border-top:1px solid #eee"><div class="flex"><span>Commission indicative</span><b>${money(p.commission)}</b></div><hr style="border:0;border-top:1px solid #eee"><div class="flex"><b>Total initial indicatif</b><b style="color:var(--orange)">${money(+p.price + +p.deposit + +p.commission)}</b></div></div><div class="notice">Les informations des annonces sont saisies par Holynk. Vérifiez-les avant toute décision. Aucun paiement sur Holynk.</div><button class="wa-btn wide" style="margin-bottom:12px" onclick="contactWhatsapp(${p.id})">☏ Contacter sur WhatsApp</button><div class="row"><button class="btn black" style="flex:1" onclick="contactWhatsapp(${p.id})">Discuter</button><button class="btn" style="flex:2" onclick="go('visit')">▦ Prendre rendez-vous</button></div></div>`}function visit(){let p=property();return `${header('Demander une visite','detail')}<div class="section"><h2>${esc(p.title)}</h2><p class="muted">${esc(p.location)}</p><div class="panel"><label class="detail-label">Date souhaitée</label><input class="field" type="date" id="date" min="${new Date().toISOString().slice(0,10)}"><label class="detail-label">Créneau</label><select class="field" id="slot"><option>Matin (8h–12h)</option><option>Après-midi (12h–17h)</option><option>Soir (17h–20h)</option></select></div><button class="btn wide" onclick="submitVisit()">Enregistrer la demande de visite</button><button class="wa-btn wide" style="margin-top:10px" onclick="sendVisitWhatsapp()">☏ Demander la visite sur WhatsApp</button><p class="muted">La demande peut être envoyée directement au responsable Holynk par WhatsApp.</p></div>`}function sendVisitWhatsapp(){const d=document.getElementById('date').value;if(!d){alert('Choisis une date.');return}const p=property();const slot=document.getElementById('slot').value;const msg=`Bonjour, je souhaite visiter le logement ${p.title} à ${p.location}, au prix de ${money(p.price)}. Date souhaitée : ${d}, créneau : ${slot}. Est-ce possible ?`;window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')}function submitVisit(){let date=document.getElementById('date').value;if(!date){alert('Choisis une date.');return}let p=property(),slot=document.getElementById('slot').value;state.visit[p.id]={date,slot,status:'À confirmer sur WhatsApp'};persist();sendVisitWhatsappFromData(p,date,slot);go('requests')}function chats(){return `${header('Discussions')}<div class="section"><h2>Parlez directement avec Holynk</h2><p class="muted">Toutes les conversations se font avec le responsable Holynk sur WhatsApp. Aucun faux message ni faux courtier.</p><button class="wa-btn wide" onclick="window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('Bonjour Holynk, je souhaite obtenir des renseignements.'),'_blank','noopener,noreferrer')">☏ Écrire à Holynk sur WhatsApp</button><h3 class="heading">Contacter à propos d’un bien</h3>${state.properties.filter(p=>p.available!==false).length?state.properties.filter(p=>p.available!==false).map(p=>`<div class="panel"><b>${esc(p.title)}</b><p class="muted">${esc(p.location)} · ${money(p.price)}</p><button class="btn wide" onclick="contactWhatsapp(${p.id})">Discuter de ce bien</button></div>`).join(''):'<div class="empty">Aucun bien publié pour le moment.</div>'}</div>`}
function conversation(){return chats()}
function sendMsg(){return}
function acceptVisit(id){if(!state.visit[id])return;state.visit[id].status='Acceptée';persist();render()}
function sendVisitWhatsappFromData(p,date,slot){const msg=`Bonjour Holynk, je souhaite visiter ${p.title} à ${p.location} (${money(p.price)}). Date : ${date}. Créneau : ${slot}.`;window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')}
function profile(){return `${header('Administration','dashboard')}<div class="section"><div class="row" style="margin:22px 0"><div class="avatar" style="width:70px;height:70px;background:var(--orange);color:white;font-size:26px">▣</div><div><h2 style="margin:0">Holynk Admin</h2><p class="muted">Gestion des annonces · Accès par code courtier</p></div></div>${[['Tableau de bord','dashboard'],['Mes biens','myproperties'],['Demandes et visites','requests']].map(([label,p])=>`<div class="panel flex" onclick="go('${p}')" style="cursor:pointer"><b>${label}</b><span>›</span></div>`).join('')}<div class="panel"><b>Ajouter un logement</b><p class="muted">La publication sera synchronisée avec Holynk Client.</p><button class="btn wide" onclick="newListing()">+ Publier un bien</button></div><div class="panel flex" onclick="leaveBroker()" style="cursor:pointer"><b>Déconnexion de l'espace Admin</b><span>›</span></div></div>`}
function dashboard(){return `${header('Tableau de bord','profile')}<div class="section"><p class="muted">Courtier démo · Activité simulée</p><div class="row" style="margin:12px 0">${['Accueil','Score','Avis'].map(t=>`<button class="tab ${state.scoreTab===t?'active':''}" onclick="state.scoreTab='${t}';render()">${t}</button>`).join('')}</div>${state.scoreTab==='Avis'?reviews():state.scoreTab==='Score'?score():`<div class="panel"><h2>Bienvenue dans votre espace courtier</h2><p>Gérez vos biens, demandes et performances.</p><button class="btn wide" onclick="newListing()">+ Ajouter un bien</button></div>${stats()}`}<div class="row"><button class="btn wide" onclick="go('myproperties')">Mes biens</button><button class="btn light wide" onclick="newListing()">+ Ajouter</button></div></div>`}function stats(){return `<h3 class="heading">Statistiques du mois</h3><div class="grid3">${[['2 540','Vues'],['340','Favoris'],['87','Contacts'],['19','Visites'],['8','Transactions'],['126','Demandes']].map(([v,l])=>`<div class="metric"><strong>${v}</strong>${l}</div>`).join('')}</div><div class="notice">Toutes les statistiques affichées sont fictives.</div>`}function score(){let metrics=[['Réactivité',92],['Satisfaction client',95],['Taux de conclusion',84],['Complétude du profil',100],['Qualité des annonces',89]];return `<div class="score"><div><b>Mon Score Holynk</b><p>🏅 Courtier Gold</p><small>Excellent · score fictif</small></div><div class="ring">87<small>/100</small></div></div><div class="panel"><h3>Détail du score</h3>${metrics.map(([l,v])=>`<div style="margin:16px 0"><div class="flex"><b>${l}</b><b style="color:var(--orange)">${v}%</b></div><div class="bar"><div style="width:${v}%"></div></div></div>`).join('')}</div>${stats()}<div class="panel"><b>Conseils Holynk</b><p>✓ Répondez rapidement aux demandes</p><p>✓ Ajoutez des photos de qualité</p><p>✓ Complétez vos annonces</p></div>`}function reviews(){let items=[['Aminata D.',5,'Excellent accompagnement. Très réactif et disponible.'],['Moussa K.',5,'Très professionnel. Le bien correspondait à l’annonce.'],['Fatou B.',4,'Bonne expérience, quelques retards pour la visite.']];return `<div class="panel"><h2 style="color:var(--orange)">★ 4,8/5</h2><p>126 avis · données fictives</p></div><div class="row">${['Tous','5','4'].map(x=>`<button class="tab ${state.rating===x?'active':''}" onclick="state.rating='${x}';render()">${x==='Tous'?'Tous':x+' ★'}</button>`).join('')}</div>${items.filter(x=>state.rating==='Tous'||String(x[1])===state.rating).map(x=>`<div class="panel"><b>${x[0]}</b><p style="color:#f39c12">${'★'.repeat(x[1])}</p><p>${x[2]}</p><button class="chip" onclick="alert('Réponse aux avis disponible dans une prochaine version.')">Répondre</button></div>`).join('')}`}function myproperties(){const mine=state.properties.filter(p=>p.demoAdded);return `${header('Mes biens','dashboard')}<div class="section"><button class="btn wide" onclick="newListing()">+ Publier un bien</button><p class="muted-note">Vos annonces sont synchronisées avec Supabase et visibles sur tous les appareils après publication.</p><div class="smallcap">Mes annonces (${mine.length})</div>${mine.length?mine.map(p=>`<div class="panel"><div class="row"><img src="${esc(p.img)}" alt="Bien" style="width:86px;height:84px;object-fit:cover;border-radius:12px"><div style="flex:1;min-width:0"><b>${esc(p.title)}</b><p class="muted">${esc(p.location)}</p><b style="color:var(--orange)">${money(p.price)}</b></div></div><div class="manage-row"><span class="status-label">${p.available===false?'Indisponible':'Disponible'}</span><button class="btn light" onclick="editListing(${p.id})">Modifier</button><button class="btn outline" onclick="toggleListing(${p.id})">${p.available===false?'Rendre disponible':'Masquer'}</button><button class="btn outline" onclick="deleteListing(${p.id})">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucun bien publié. Ajoutez votre première annonce.</div>'}</div>`}
function newListing(){state.editingId=null;state.step=1;state.draft={listingType:'À louer',amenities:[]};go('add')}
function editListing(id){const p=state.properties.find(x=>x.id===id&&x.demoAdded);if(!p)return;state.editingId=id;state.draft={...p,amenities:[...(p.amenities||[])]};state.step=1;go('add')}
async function toggleListing(id){const p=state.properties.find(x=>x.id===id&&x.demoAdded);if(!p)return;try{await apiWrite('PATCH',{id,available:p.available===false});p.available=p.available===false;persist();render()}catch(e){alert('Modification non enregistrée : '+e.message)}}
async function deleteListing(id){const p=state.properties.find(x=>x.id===id&&x.demoAdded);if(!p||!confirm('Supprimer définitivement cette annonce ?'))return;try{await apiWrite('DELETE',{id});state.properties=state.properties.filter(x=>x.id!==id);state.favs=state.favs.filter(x=>x!==id);persist();render()}catch(e){alert('Suppression non enregistrée : '+e.message)}}
function requests(){let entries=Object.entries(state.visit);return `${header('Demandes et visites','profile')}<div class="section">${entries.length?entries.map(([id,v])=>`<div class="panel"><b>${esc(state.properties.find(p=>p.id===+id)?.title||'Annonce supprimée')}</b><p>${v.date} · ${v.slot}</p><span class="chip">${v.status}</span>${state.mode==='broker'?`<button class="btn" onclick="acceptVisit(${id})">Accepter</button>`:''}</div>`).join(''):'<div class="empty">Aucune demande pour le moment.</div>'}</div>`}function add(){let d=state.draft,amen=['Wi-Fi','Climatisation','Eau courante','Chauffe-eau','Cuisine équipée','Électricité','Gardien','Machine à laver','Réfrigérateur','Parking','Groupe électrogène','Balcon / Terrasse'];let content=state.step===1?`<label class="detail-label">Type d’annonce</label><select id="listingType" class="field"><option ${d.listingType==='À louer'?'selected':''}>À louer</option><option ${d.listingType==='À vendre'?'selected':''}>À vendre</option></select><label class="detail-label">Titre du bien</label><input class="field" id="title" value="${esc(d.title||'')}" placeholder="Ex. Appartement lumineux"><label class="detail-label">Type de logement</label><select id="type" class="field">${['Appartement','Maison','Villa','Studio','Chambre'].map(x=>`<option ${d.type===x?'selected':''}>${x}</option>`).join('')}</select><label class="detail-label">Localisation</label><input id="location" class="field" value="${esc(d.location||'')}" placeholder="Ex. Almadies, Dakar"><label class="detail-label">Prix (FCFA)</label><input id="price" type="number" class="field" value="${esc(d.price||'')}" placeholder="Ex. 175000"><label class="detail-label">Caution (FCFA)</label><input id="deposit" type="number" class="field" value="${esc(d.deposit||'')}" placeholder="Ex. 175000"><label class="detail-label">Commission (FCFA)</label><input id="commission" type="number" class="field" value="${esc(d.commission||'')}" placeholder="Ex. 87500"><label class="detail-label">Description</label><textarea id="description" class="field" rows="3">${esc(d.description||'')}</textarea>`:state.step===2?`<label class="detail-label">Chambres</label><input id="rooms" type="number" class="field" min="0" value="${d.rooms||1}"><label class="detail-label">Surface (m²)</label><input id="area" type="number" class="field" value="${d.area||50}"><label class="detail-label">Étage</label><select id="floor" class="field">${['Rez-de-chaussée','1er étage','2ème étage','3ème étage','Autre'].map(x=>`<option>${x}</option>`).join('')}</select>`:state.step===3?`<p>Sélectionnez les commodités :</p>${amen.map(x=>`<button class="chip ${d.amenities.includes(x)?'selected':''}" onclick="toggleAmen('${x}')">${d.amenities.includes(x)?'✓ ':''}${x}</button>`).join('')}`:state.step===4?`<p>Équipements de sécurité (facultatif)</p>${['Caméras de surveillance','Gardien 24h/24','Portail électrique','Interphone','Système d’alarme'].map(x=>`<button class="chip ${d.amenities.includes(x)?'selected':''}" onclick="toggleAmen('${x}')">${x}</button>`).join('')}`:state.step===5?`<p>Sélectionnez une photo illustrative pour votre annonce. Les images sont illustratives et ne représentent pas nécessairement le logement réel.</p><div class="cards">${photos.map((x,i)=>`<div onclick="state.draft.img=photos[${i}];render()" style="border:${d.img===x?'3px solid var(--orange)':'3px solid transparent'};border-radius:12px;overflow:hidden"><img src="${x}" style="width:100%;height:115px;object-fit:cover"></div>`).join('')}</div>`:`<div class="panel"><h3>${esc(d.title||'Nouveau logement')}</h3><p>${esc(d.location||'Localisation non renseignée')}</p><p>${money(d.price||0)}</p><p>Chambres : ${d.rooms||1} · Surface : ${d.area||50} m²</p><p>${(d.amenities||[]).join(', ')}</p></div><div class="notice">Cette annonce sera publiée dans le catalogue Holynk et visible sur tous les appareils.</div>`;return `${header('Ajouter un bien','myproperties')}<div class="section"><p class="muted">Publiez votre bien en quelques étapes</p><div style="margin:25px 0">${[1,2,3,4,5,6].map(n=>`<span class="step ${n===state.step?'on':''}">${n}</span>`).join('')}</div><h2>${['Informations générales','Détails du bien','Commodités','Sécurité','Photos','Aperçu'][state.step-1]}</h2><div class="panel">${content}</div><div class="row">${state.step>1?`<button class="btn outline" onclick="state.step--;render()">Retour</button>`:''}<button class="btn wide" onclick="nextStep()">${state.step===6?(state.editingId?'Enregistrer les modifications':'Publier'):'Suivant →'}</button></div></div>`}function toggleAmen(x){let a=state.draft.amenities;state.draft.amenities=a.includes(x)?a.filter(y=>y!==x):[...a,x];render()}async function nextStep(){let d=state.draft;if(state.step===1){for(let x of ['title','location','price','deposit','commission','description'])d[x]=document.getElementById(x).value;d.type=document.getElementById('type').value;d.listingType=document.getElementById('listingType').value;if(!d.title.trim()||!d.location.trim()||!(Number(d.price)>0)){alert('Renseigne un titre, une localisation et un prix positif.');return}}if(state.step===2){d.rooms=+document.getElementById('rooms').value;d.area=+document.getElementById('area').value;d.floor=document.getElementById('floor').value}if(state.step<6){state.step++;render();return}const existing=state.editingId?state.properties.find(p=>p.id===state.editingId&&p.demoAdded):null;const data={id:existing?.id||Date.now(),title:d.title,location:d.location,price:+d.price,deposit:+d.deposit||0,commission:+d.commission||0,description:d.description||'',listingType:d.listingType||'À louer',type:d.type,rooms:d.rooms||1,area:d.area||50,floor:d.floor||'',broker:'Holynk',score:100,img:d.img||photos[0],amenities:d.amenities||[],demoAdded:true,available:existing?.available??true};try{await apiWrite('POST',{listing:data});if(existing){Object.assign(existing,data)}else{state.properties.unshift(data)}state.step=1;state.editingId=null;state.draft={listingType:'À louer',amenities:[]};persist();go('myproperties');alert('Annonce publiée ! Elle est visible sur tous les appareils.')}catch(e){alert('Publication impossible : '+e.message+'. Votre formulaire est conservé.')}}function notifications(){return `${header('Notifications')}<div class="section"><div class="empty">Aucune nouvelle notification.</div></div>`}
const STORE='holynk_mvp_v1_data';
function persist(){try{localStorage.setItem(STORE,JSON.stringify({favs:state.favs,visit:state.visit,messages:state.messages,properties:state.properties.filter(p=>p.demoAdded),mode:state.mode}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(STORE)||'{}');state.favs=Array.isArray(d.favs)?d.favs:[];state.visit=d.visit||{};state.messages={};if(Array.isArray(d.properties))state.properties=d.properties.filter(p=>p&&p.demoAdded);state.mode='client'}catch(e){}}

const LISTINGS_API='https://hxlmyezwvslfsrbxskus.supabase.co/functions/v1/listings';
let remoteListingsLoaded=false;
function syncCatalog(items){
 const local=state.properties.filter(p=>p.demoAdded);
 const remote=(Array.isArray(items)?items:[]).map(p=>({...p,demoAdded:true}));
 const missingLocal=brokerUnlocked?local.filter(p=>!remote.some(r=>Number(r.id)===Number(p.id))):[];
 state.properties=[...remote,...missingLocal];
 remoteListingsLoaded=true;
 render();
}
async function loadCatalog(){
 try{
  const response=await fetch(LISTINGS_API,{cache:'no-store'});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Erreur réseau');
  syncCatalog(data.listings);
 }catch(e){console.warn('Holynk catalogue :',e.message);}
}
async function apiWrite(method,body){
 if(!brokerUnlocked||!brokerCodeSession)throw Error('Veuillez entrer votre code courtier');
 const response=await fetch(LISTINGS_API,{method,headers:{'Content-Type':'application/json','X-Holynk-Broker-Code':brokerCodeSession},body:JSON.stringify(body)});
 let data={};try{data=await response.json()}catch(e){}
 if(!response.ok)throw Error(data.error||'Erreur réseau ('+response.status+')');
 return data;
}
async function migrateLocalListings(){
 const local=state.properties.filter(p=>p.demoAdded);
 if(!local.length){await loadCatalog();return;}
 try{
  const response=await fetch(LISTINGS_API,{cache:'no-store'});
  if(!response.ok)throw Error('Catalogue distant inaccessible');
  const data=await response.json();
  let count=0;
  for(const p of local){
   if(!(data.listings||[]).some(r=>Number(r.id)===Number(p.id))){
    await apiWrite('POST',{listing:p});count++;
   }
  }
  await loadCatalog();
  if(count)alert(count+' ancienne(s) annonce(s) transférée(s) vers Supabase.');
 }catch(e){console.warn('Migration des annonces locales non terminée :',e);alert('Les anciennes annonces restent sur cet appareil. Synchronisation impossible : '+e.message);}
}
window.addEventListener('focus',()=>{if(state.page!=='welcome'&&state.page!=='access')loadCatalog()});

function enterDemo(){localStorage.setItem('holynk_demo_connected','true');go('home')}
async function resetDemo(){if(!confirm('Réinitialiser la démo Holynk ? Les favoris, annonces ajoutées, conversations et demandes de visite enregistrés sur cet appareil seront effacés.'))return;brokerUnlocked=false;brokerCodeSession='';localStorage.removeItem(STORE);localStorage.removeItem('holynk_demo_connected');location.reload()}
function welcome(){return `<div class="welcome-screen"><div class="welcome-main"><div class="brand-house">⌂</div><div class="welcome-brand">Ho<span>Lynk</span></div><p>Holynk vous aide à trouver<br>le bon logement au bon prix,<br>en toute confiance.</p></div><button class="btn wide welcome-cta" onclick="go('access')">Commencer &nbsp; →</button></div>`}
function access(){return `<div class="access-screen"><div class="access-photo"></div><div class="access-sheet"><div class="welcome-brand" style="font-size:42px">Ho<span>Lynk</span></div><p>Cherchez moins. Trouvez mieux.<br>Bienvenue sur Holynk</p><button class="btn black wide" onclick="enterDemo()">Connexion &nbsp; →</button><button class="btn wide" onclick="enterDemo()">Inscription &nbsp; →</button><p class="muted" style="font-size:12px;margin-top:18px">Accès démo : aucun numéro ni e-mail demandé.</p></div></div>`}
function settings(){return `${header('Paramètres','profile')}<div class="section"><div class="panel"><b>Holynk Admin</b><p class="muted">Les annonces sont partagées avec la version client grâce à Supabase.</p></div><div class="panel"><b>Mode de connexion</b><p class="muted">Code courtier partagé pour le MVP. Ne communique ce code qu'aux testeurs autorisés.</p></div><button class="btn outline wide" onclick="leaveBroker()">Quitter l'espace Admin</button></div>`}
let brokerUnlocked=false;let brokerCodeSession='';
function leaveBroker(){brokerCodeSession='';brokerUnlocked=false;state.mode='client';persist();state.page='brokerGate';render()}
function openBrokerGate(){if(brokerUnlocked){state.mode='broker';go('dashboard');return}state.page='brokerGate';render()}
function brokerGate(){return `${header('Accès Courtier','brokerGate')}<div class="section"><div class="panel" style="text-align:center;padding:25px 18px"><div style="font-size:36px;color:var(--orange)">♙</div><h2>Espace Courtier</h2><p class="muted">Accès Courtier — mode démonstration.</p><label class="detail-label" for="brokerCode">Code d'accès à 6 chiffres</label><input class="field" id="brokerCode" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')submitBrokerCode()"><p id="brokerError" style="color:#b42318;font-size:13px" role="alert"></p><button id="brokerSubmit" class="btn wide" onclick="submitBrokerCode()">Accéder à l'espace Courtier</button><p class="muted-note" style="margin-top:15px">Interface de gestion réservée au responsable Holynk.</p></div></div>`}
async function submitBrokerCode(){const field=document.getElementById('brokerCode'),code=field.value,err=document.getElementById('brokerError'),btn=document.getElementById('brokerSubmit');if(!/^\d{6}$/.test(code)){err.textContent='Saisissez un code à 6 chiffres.';return}btn.disabled=true;err.textContent='';try{const bytes=new TextEncoder().encode(code);const digest=await crypto.subtle.digest('SHA-256',bytes);const hex=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex!=='d44ec0689c6b3cc23d222c52b99c60864aa5ed8fb863d446d65bc02cd85d5c98'){err.textContent='Code incorrect.';field.value='';return}brokerCodeSession=code;brokerUnlocked=true;state.mode='broker';persist();go('dashboard');await loadCatalog()}catch(e){err.textContent='Impossible de vérifier le code dans ce navigateur.'}finally{btn.disabled=false}}

function render(){if(!brokerUnlocked){state.mode='client';state.page='brokerGate'}else{state.mode='broker';if(['welcome','access','home','detail','visit','favs','chats','conversation'].includes(state.page))state.page='dashboard'}let page={welcome,access,settings,brokerGate,home,detail,visit,chats,conversation,profile,dashboard,myproperties,requests,add,favs:()=>`${header('Favoris')}<div class="section">${cards(state.properties.filter(p=>p.available!==false&&state.favs.includes(p.id)))}</div>`}[state.page]||home;app.innerHTML=page()+(['welcome','access','settings','brokerGate'].includes(state.page)?'':nav())}restore();state.mode='client';state.page='brokerGate';render();loadCatalog();
</script></body></html>
